[project]
name = "grag"
version = "0.1.0"
description = ""
authors = [
    {name = "Junfeng Liu",email = "jliu85@ncsu.edu"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch (>=2.6.0,<3.0.0)",
    "transformers (>=4.51.3,<5.0.0)",
    "auto-gptq (>=0.7.1,<0.8.0)",
    "pytorch-ignite (>=0.5.2,<0.6.0)",
    "tensorboardx (>=2.6.2.2,<3.0.0.0)",
    "torchmetrics (>=1.7.1,<2.0.0)",
    "rouge-score (>=0.1.2,<0.2.0)",
    "sacrebleu (>=2.5.1,<3.0.0)",
    "evaluate (>=0.4.3,<0.5.0)",
    "spacey (>=0.1.1,<0.2.0)",
    "peft (>=0.19.1,<0.20.0)",
    "datasets (>=3.5.0,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "optimum (>=1.24.0,<2.0.0)",
    "bitsandbytes (>=0.50.2,<0.51.0)"
]
packages = [
    {include = "grag", from = "src"}
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
